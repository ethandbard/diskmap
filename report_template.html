<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskmap — __DM_TITLE__</title>
<style>
  :root{
    --bg:#081522; --ink:#0B1E33; --panel:#0D2338; --panel-2:#112B45; --line:#2A4A6B; --line-soft:rgba(124,144,163,.16);
    --paper:#F2EFE9; --cyan:#4FB3D9; --amber:#E8A33D; --slate:#7C90A3; --danger:#D9694F;
    --mono:'Cascadia Mono','SFMono-Regular',Menlo,Consolas,monospace;
    --body:'Inter','Segoe UI Variable','Segoe UI',-apple-system,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--body);
    background-image:radial-gradient(1200px 600px at 85% -10%,rgba(79,179,217,.10),transparent 60%),
                     radial-gradient(900px 500px at -10% 10%,rgba(232,163,61,.06),transparent 60%);
    background-attachment:fixed;}
  button{font:inherit;color:inherit;}
  .wrap{max-width:1400px;margin:0 auto;padding:24px 22px 64px;}

  /* header */
  .hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{display:grid;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(3,7px);gap:2px;}
  .logo i{background:var(--cyan);border-radius:1.5px;animation:blink 3.2s var(--ease) infinite;}
  .logo i:nth-child(3n){background:var(--amber);} .logo i:nth-child(4){background:#7FD1A8;}
  .logo i:nth-child(2){animation-delay:.2s}.logo i:nth-child(3){animation-delay:.4s}.logo i:nth-child(4){animation-delay:.6s}
  .logo i:nth-child(5){animation-delay:.8s}.logo i:nth-child(6){animation-delay:1s}.logo i:nth-child(7){animation-delay:1.2s}
  .logo i:nth-child(8){animation-delay:1.4s}.logo i:nth-child(9){animation-delay:1.6s}
  @keyframes blink{0%,70%,100%{opacity:1;transform:scale(1)}80%{opacity:.35;transform:scale(.7)}}
  .title{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .title span{color:var(--cyan);}
  .sub{font-family:var(--mono);font-size:12px;color:var(--slate);margin-top:4px;word-break:break-all;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:rgba(18,49,79,.45);border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-width:112px;
    font-family:var(--mono);font-size:11px;color:var(--slate);opacity:0;transform:translateY(8px);
    animation:rise .7s var(--ease) forwards;}
  .stat b{display:block;color:var(--paper);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:1px;}
  .stat:first-child b{color:var(--amber);}
  .stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}.stat:nth-child(4){animation-delay:.24s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* toolbar */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .crumbs{display:flex;align-items:center;gap:2px;flex:1 1 360px;min-width:0;overflow:hidden;font-family:var(--mono);font-size:12.5px;}
  .crumb{background:none;border:0;padding:5px 8px;border-radius:5px;cursor:pointer;color:var(--slate);white-space:nowrap;
    max-width:220px;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s;animation:crumbIn .35s var(--ease);}
  .crumb:hover{background:rgba(79,179,217,.12);color:var(--paper);}
  .crumb.cur{color:var(--paper);font-weight:600;cursor:default;background:rgba(79,179,217,.10);}
  .crumb-sep{color:var(--line);user-select:none;}
  @keyframes crumbIn{from{opacity:0;transform:translateX(-6px)}}
  .up{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
    transition:border-color .2s,transform .2s var(--ease),opacity .2s;}
  .up:hover:not(:disabled){border-color:var(--cyan);transform:translateY(-1px);}
  .up:disabled{opacity:.35;cursor:default;}
  .seg{position:relative;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px;}
  .seg button{position:relative;z-index:1;background:none;border:0;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--slate);transition:color .25s;}
  .seg button.on{color:var(--bg);font-weight:600;}
  .seg .knob{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:5px;background:var(--cyan);transition:left .35s var(--ease),width .35s var(--ease);}
  .search{position:relative;}
  .search input{width:240px;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--paper);
    padding:7px 30px 7px 30px;font-family:var(--mono);font-size:12px;outline:none;transition:border-color .2s,width .35s var(--ease),box-shadow .2s;}
  .search input:focus{border-color:var(--cyan);width:300px;box-shadow:0 0 0 3px rgba(79,179,217,.15);}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none;}
  .search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--slate);
    border:1px solid var(--line);border-radius:3px;padding:0 4px;pointer-events:none;}
  .results{position:absolute;right:0;top:calc(100% + 6px);width:420px;max-height:380px;overflow:auto;z-index:30;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:4px;
    opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .18s,transform .25s var(--ease);}
  .results.show{opacity:1;transform:none;pointer-events:auto;}
  .res{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:5px;cursor:pointer;font-family:var(--mono);font-size:11.5px;}
  .res:hover,.res.on{background:rgba(79,179,217,.12);}
  .res .p{color:var(--slate);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;}
  .res .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .res .sz{color:var(--amber);white-space:nowrap;}
  .res-head{font-size:10.5px;color:var(--slate);padding:6px 8px 4px;font-family:var(--mono);}

  /* map + inspector */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;}
  .mapbox{position:relative;background:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.35);}
  #map{display:block;width:100%;height:620px;cursor:pointer;}
  .hint{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:10.5px;color:rgba(242,239,233,.55);
    background:rgba(8,21,34,.7);padding:3px 8px;border-radius:4px;pointer-events:none;transition:opacity .6s;}
  .tip{position:fixed;z-index:40;pointer-events:none;background:rgba(10,27,44,.96);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;min-width:200px;max-width:340px;box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;transform:scale(.96);
    transition:opacity .12s,transform .18s var(--ease);font-size:12px;backdrop-filter:blur(6px);}
  .tip.show{opacity:1;transform:none;}
  .tip .t-name{font-weight:600;word-break:break-all;display:flex;gap:7px;align-items:center;}
  .tip .t-size{font-family:var(--mono);color:var(--amber);font-size:16px;margin:6px 0 2px;}
  .tip .t-dim{font-family:var(--mono);color:var(--slate);font-size:10.5px;line-height:1.55;}
  .tip .t-bar{height:4px;border-radius:2px;background:rgba(124,144,163,.2);margin:6px 0;overflow:hidden;}
  .tip .t-bar i{display:block;height:100%;background:var(--cyan);border-radius:2px;}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;}

  .insp{background:rgba(18,49,79,.45);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;
    gap:12px;min-height:0;max-height:620px;overflow:hidden;}
  .insp-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);}
  .insp-name{font-size:17px;font-weight:650;word-break:break-all;line-height:1.25;}
  .insp-size{font-family:var(--mono);font-size:26px;color:var(--amber);font-variant-numeric:tabular-nums;}
  .insp-meta{font-family:var(--mono);font-size:11px;color:var(--slate);line-height:1.7;}
  .insp-meta b{color:var(--paper);font-weight:500;}
  .comp{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(124,144,163,.15);}
  .comp i{display:block;height:100%;transition:filter .2s;transform-origin:left;animation:grow .8s var(--ease) both;}
  .comp i:hover{filter:brightness(1.3);}
  .kids{overflow:auto;min-height:0;margin:0 -6px;padding:0 6px;}
  .kid{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer;
    font-family:var(--mono);font-size:11.5px;position:relative;opacity:0;animation:fadeIn .4s var(--ease) forwards;}
  .kid:hover{background:rgba(79,179,217,.10);}
  .kid .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kid .sz{color:var(--amber);white-space:nowrap;font-size:11px;}
  .kid .kb{grid-column:2/4;height:3px;background:rgba(124,144,163,.15);border-radius:2px;overflow:hidden;}
  .kid .kb i{display:block;height:100%;border-radius:2px;transform-origin:left;animation:grow .7s var(--ease) both;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:6px 10px;
    border-radius:6px;cursor:pointer;transition:border-color .2s,color .2s,transform .15s var(--ease);}
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn:active{transform:scale(.96);}
  .btn.ok{border-color:#7FD1A8;color:#7FD1A8;}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:30px;}
  .lg{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line-soft);border-radius:999px;cursor:pointer;
    font-size:11.5px;background:rgba(13,35,56,.6);transition:border-color .2s,background .2s,opacity .2s,transform .2s var(--ease);
    opacity:0;animation:fadeIn .4s var(--ease) forwards;}
  .lg:hover{border-color:var(--line);transform:translateY(-1px);}
  .lg.on{border-color:var(--cyan);background:rgba(79,179,217,.14);}
  .legend.filtering .lg:not(.on){opacity:.45;}
  .lg small{font-family:var(--mono);color:var(--slate);font-size:10.5px;}
  .grad{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--slate);animation:fadeIn .4s var(--ease);}
  .grad i{display:block;width:220px;height:8px;border-radius:4px;}
  .filterpill{display:none;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--cyan);margin-left:auto;}
  .filterpill.show{display:flex;animation:fadeIn .3s var(--ease);}

  /* tabs */
  .tabs{display:flex;gap:4px;position:relative;margin:34px 0 0;border-bottom:1px solid var(--line);}
  .tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--slate);font-size:13px;transition:color .2s;}
  .tab:hover{color:var(--paper);} .tab.on{color:var(--paper);}
  .tab small{font-family:var(--mono);font-size:10.5px;color:var(--slate);margin-left:4px;}
  .tabline{position:absolute;bottom:-1px;height:2px;background:var(--cyan);border-radius:2px;transition:left .4s var(--ease),width .4s var(--ease);
    box-shadow:0 0 10px var(--cyan);}
  .pane{display:none;padding-top:14px;} .pane.on{display:block;animation:fadeIn .35s var(--ease);}
  .note{font-family:var(--mono);font-size:11px;color:var(--slate);margin:0 0 10px;}
  .card{background:rgba(18,49,79,.45);border:1px solid var(--line);border-radius:10px;padding:6px;}
  .scroll{max-height:520px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
  th{text-align:left;font-weight:500;color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:7px 10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:#0D2338;z-index:1;}
  td{padding:6px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr{cursor:pointer;transition:background .15s;opacity:0;animation:fadeIn .45s var(--ease) forwards;}
  tbody tr:hover td{background:rgba(79,179,217,.08);}
  tbody tr:hover .go{opacity:1;transform:none;}
  .go{opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s var(--ease);color:var(--cyan);white-space:nowrap;}
  .num{color:var(--amber);white-space:nowrap;text-align:right;}
  .dim{color:var(--slate);white-space:nowrap;}
  .rank{color:var(--slate);width:30px;}
  .path{word-break:break-all;}
  .path .dir{color:var(--slate);}
  .meter{display:inline-block;width:120px;height:6px;border-radius:3px;background:rgba(124,144,163,.16);overflow:hidden;vertical-align:middle;margin-right:8px;}
  .meter i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:grow .9s var(--ease) both;}
  .empty{color:var(--slate);text-align:center;padding:18px;}

  /* tree */
  .tree-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .tree{font-family:var(--mono);font-size:12.3px;padding:6px 6px 10px;}
  .row{display:grid;grid-template-columns:18px minmax(0,1fr) 90px 130px 120px 22px;gap:8px;align-items:center;padding:3px 6px;border-radius:5px;
    cursor:pointer;transition:background .15s;}
  .row:hover{background:rgba(79,179,217,.08);}
  .row:hover .loc{opacity:1;}
  .caret{color:var(--slate);transition:transform .3s var(--ease),color .2s;display:inline-block;text-align:center;}
  .open > .row .caret{transform:rotate(90deg);color:var(--cyan);}
  .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .nm.dirn{font-weight:600;}
  .row .sz{color:var(--amber);text-align:right;white-space:nowrap;}
  .row .ct{color:var(--slate);font-size:10.5px;white-space:nowrap;}
  .row .loc{opacity:0;color:var(--cyan);transition:opacity .2s;text-align:center;}
  .row .err{color:var(--danger);font-size:10.5px;margin-left:6px;}
  .row .lnk{color:var(--cyan);font-size:10.5px;margin-left:6px;}
  .kidsw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease);}
  .open > .kidsw{grid-template-rows:1fr;}
  .kidsw > div{overflow:hidden;margin-left:14px;border-left:1px solid var(--line-soft);padding-left:4px;}
  .flash{animation:flashrow 1.6s var(--ease);}
  @keyframes flashrow{0%,40%{background:rgba(232,163,61,.28)}100%{background:transparent}}

  .foot{font-family:var(--mono);font-size:10.5px;color:var(--slate);margin-top:26px;line-height:1.7;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--panel-2);border:1px solid var(--line);
    padding:9px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:50;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:980px){
    .stage{grid-template-columns:1fr;}
    .insp{max-height:none;}
    #map{height:460px;}
    .stats{display:grid;grid-template-columns:1fr 1fr;width:100%;}
    .crumbs{flex:1 1 0;}
    .row{grid-template-columns:18px minmax(0,1fr) 80px 22px;}
    .row .ct,.row .bcell{display:none;}
    .search input,.search input:focus{width:100%;}
    .search{flex:1 1 100%;}
    .results{width:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div>
      <div class="brand">
        <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p class="title">disk<span>map</span></p>
      </div>
      <div class="sub" id="rootpath"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="st-size">0 B</b>total size</div>
      <div class="stat"><b id="st-files">0</b>files</div>
      <div class="stat"><b id="st-dirs">0</b>folders</div>
      <div class="stat"><b id="st-time">0.0s</b>scan time</div>
    </div>
  </header>

  <div class="bar">
    <button class="up" id="up" title="Up one level (Esc)" aria-label="Up one level">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
    </button>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="seg" id="mode" role="tablist" aria-label="Colour by">
      <span class="knob"></span>
      <button data-mode="type" class="on">Type</button>
      <button data-mode="age">Age</button>
      <button data-mode="folder">Folder</button>
    </div>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Find files and folders" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
      <div class="results" id="results"></div>
    </div>
  </div>

  <div class="stage">
    <div>
      <div class="mapbox" id="mapbox">
        <canvas id="map"></canvas>
        <div class="hint" id="hint">click to zoom in · right-click or Esc to go up · / to search</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="insp" id="insp"></aside>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-pane="p-largest">Largest files</button>
    <button class="tab" data-pane="p-types">By file type</button>
    <button class="tab" data-pane="p-old">Large &amp; untouched</button>
    <button class="tab" data-pane="p-tree">Tree</button>
    <span class="tabline" id="tabline"></span>
  </div>
  <section class="pane on" id="p-largest"><div class="card scroll" id="t-largest"></div></section>
  <section class="pane" id="p-types"><p class="note">Click a type to light it up in the treemap.</p><div class="card scroll" id="t-types"></div></section>
  <section class="pane" id="p-old"><p class="note" id="old-note"></p><div class="card scroll" id="t-old"></div></section>
  <section class="pane" id="p-tree">
    <div class="tree-tools">
      <button class="btn" id="tr-collapse">Collapse all</button>
      <button class="btn" id="tr-heavy">Follow the heaviest path</button>
    </div>
    <div class="card scroll"><div class="tree" id="tree"></div></div>
  </section>

  <div class="foot" id="foot"></div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script id="dm-data" type="application/json">__DM_DATA__</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("dm-data").textContent);
const META = DATA.meta, SEP = DATA.sep, TODAY = META.today;
const $ = (s, el) => (el || document).querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

function human(n){
  const u = ["B","KB","MB","GB","TB","PB"]; let i = 0; n = +n;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return i === 0 ? Math.round(n) + " B" : n.toLocaleString(undefined, {minimumFractionDigits:1, maximumFractionDigits:1}) + " " + u[i];
}
const fmtInt = n => Math.round(n).toLocaleString();
function fmtDay(d){ return d ? new Date(d * 864e5).toISOString().slice(0, 10) : ""; }
function ago(d){
  if (!d) return "";
  const a = TODAY - d;
  if (a < 1) return "today";

  const parent = n.p || n, pct = parent.s ? n.s / parent.s * 100 : 100, tot = ROOT.s ? n.s / ROOT.s * 100 : 100;
  const col = isDir(n) ? "#4FB3D9" : isMore(n) ? "#3A5068" : mode === "age" ? ageColor(n.d) : CAT_INFO[catOf(n)].col;
  const kind = isMore(n) ? "collapsed items" : isDir(n) ? `folder · ${fmtInt(count(n))} items` : `${CAT_INFO[catOf(n)].name.toLowerCase()} · .${extOf(n.n) || "—"}`;
  tip.innerHTML = `<div class="t-name"><span class="sw" style="background:${col}"></span>${esc(label(n))}</div>
    <div class="t-size">${human(n.s)}</div>
    <div class="t-bar"><i style="width:${clamp(pct, 0, 100).toFixed(1)}%"></i></div>
    <div class="t-dim">${pct.toFixed(1)}% of ${esc(parent === n ? "total" : parent.n)} · ${tot.toFixed(2)}% of everything<br>
    ${kind}${n.d ? `<br>modified ${fmtDay(n.d)} · ${ago(n.d)}` : ""}</div>`;
  tip.classList.add("show");
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tx = cx + 16, ty = cy + 16;
  if (tx + tw > innerWidth - 8) tx = cx - tw - 16;
  if (ty + th > innerHeight - 8) ty = cy - th - 16;
  tip.style.left = Math.max(8, tx) + "px"; tip.style.top = Math.max(8, ty) + "px";
}
function hideTip(){ tip.classList.remove("show"); }
function pos(e){ const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }

canvas.addEventListener("mousemove", e => {
  if (anim) return;
  const [x, y] = pos(e), r = hitTest(x, y);
  const n = r ? r.n : null;
  if (n !== hover){ hover = n; kick(); }
  if (n) showTip(n, e.clientX, e.clientY); else hideTip();
});
canvas.addEventListener("mouseleave", () => { hover = null; hideTip(); kick(); });
canvas.addEventListener("click", e => {
  if (anim) return;
  const [x, y] = pos(e), r = hitTest(x, y);
  ripples.push({x, y, t0: performance.now()}); kick();
  $("#hint").style.opacity = 0;
  if (!r) return;
  // A folder's header or solid block opens that folder; a file steps one level toward it,
  // and a file sitting directly in the focus gets selected instead.
  let target = r.n;
  if (!isDir(r.n)){ target = r.n; while (target.p && target.p !== L.focus) target = target.p; }
  if (target === r.n && !isDir(r.n)){ selected = r.n; renderInspector(r.n); kick(); return; }

  if (typing) return;
  if (e.key === "Escape" || e.key === "Backspace"){ e.preventDefault(); if (filter && filter.kind !== "search"){ setFilter(null); } else up(); }
});

/* ------------------------------------------------------------ breadcrumbs */
function renderCrumbs(){
  const nav = $("#crumbs"); nav.innerHTML = "";
  const chain = []; for (let k = L.focus; k; k = k.p) chain.unshift(k);
  const shown = chain.length > 6 ? [chain[0], null, ...chain.slice(-4)] : chain;
  shown.forEach((k, i) => {
    if (i) nav.appendChild(el("span", "crumb-sep", "›"));
    if (!k){ nav.appendChild(el("span", "crumb-sep", "…")); return; }

/* ------------------------------------------------------------ inspector */
function tween(node, from, to, fmt, dur = 700){

  const t0 = performance.now();
  const step = now => { const t = clamp((now - t0) / dur, 0, 1); node.textContent = fmt(lerp(from, to, easeOut(t))); if (t < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let lastInspSize = 0;
function swatch(n, i, top){

  return mode === "age" ? ageColor(n.d) : CAT_INFO[catOf(n)].col;
}
function renderInspector(n){

  const size = el("div", "insp-size"); box.appendChild(size); tween(size, lastInspSize, n.s, human); lastInspSize = n.s;
  const meta = [];
  if (parent) meta.push(`<b>${(parent.s ? n.s / parent.s * 100 : 0).toFixed(1)}%</b> of ${esc(parent.n === DATA.root ? "the root" : parent.n)}`);

  box.appendChild(el("div", "insp-meta", meta.join("<br>")));

  const acts = el("div", "acts");
  const copy = el("button", "btn", "Copy path");
  copy.onclick = () => copyText(pathOf(n)).then(() => { copy.textContent = "Copied ✓"; copy.classList.add("ok"); setTimeout(() => { copy.textContent = "Copy path"; copy.classList.remove("ok"); }, 1400); });

/* ------------------------------------------------------------ legend + filters */
const catTotals = new Map();
function totalsFor(focus){
  // Bytes per category under a folder, plus a size-weighted modified day (_day / _w).
  if (catTotals.has(focus)) return catTotals.get(focus);
  const acc = {_day: 0, _w: 0}; const stack = [focus];
  while (stack.length){
    const n = stack.pop();
    if (n.c){ for (const k of n.c) stack.push(k); continue; }
    if (isDir(n) || isMore(n)) continue;
    acc[catOf(n)] = (acc[catOf(n)] || 0) + n.s;
    if (n.d && n.s){ acc._day += n.d * n.s; acc._w += n.s; }
  }
  catTotals.set(focus, acc); return acc;
}
function topCat(sum){ let best = null; for (const [id] of CATS) if (sum[id] && (!best || sum[id] > sum[best])) best = id; return best; }
function mix(a, b, t){
  const p = c => c[0] === "#" ? hexRgb(c) : c.match(/\d+/g).map(Number);
  const x = p(a), y = p(b);
  return `rgb(${Math.round(lerp(x[0], y[0], t))},${Math.round(lerp(x[1], y[1], t))},${Math.round(lerp(x[2], y[2], t))})`;
}
function setFilter(f){

}

    CATS.map(c => c[0]).filter(id => tot[id]).sort((a, b) => tot[b] - tot[a]).forEach((id, i) => {
      const b = el("button", "lg" + (filter && filter.kind === "cat" && filter.cat === id ? " on" : ""));
      b.style.animationDelay = (i * 30) + "ms";
      b.innerHTML = `<span class="sw" style="background:${CAT_INFO[id].col}"></span>${CAT_INFO[id].name}<small>${human(tot[id])}</small>`;

      lg.appendChild(b);
    });
  } else if (mode === "age"){

  } else {
    lg.appendChild(el("div", "grad", "<span>each top-level folder in this view gets its own hue; files are brighter than folders</span>"));
  }

    const p = el("span", "filterpill show"); p.id = "filterpill";
    p.innerHTML = `highlighting ${esc(filter.kind === "cat" ? CAT_INFO[filter.cat].name : filter.ext)} <button class="btn">clear</button>`;

    lg.appendChild(p);
  }
}
(function modeSwitch(){

/* ------------------------------------------------------------ search */
const q = $("#q"), results = $("#results");
let allNodes = null, resIdx = -1, resList = [];
function searchAll(term){
  if (!allNodes){ allNodes = []; const st = [ROOT]; while (st.length){ const n = st.pop(); if (n !== ROOT && !isMore(n)) allNodes.push(n); if (n.c) for (const k of n.c) st.push(k); } }
  const t = term.toLowerCase(), out = [];
  for (const n of allNodes) if (n.n.toLowerCase().includes(t)) out.push(n);
  return out.sort((a, b) => b.s - a.s);
}
let qt = 0;
q.addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(runSearch, 120); });
q.addEventListener("focus", () => { if (resList.length) results.classList.add("show"); });
q.addEventListener("blur", () => setTimeout(() => results.classList.remove("show"), 160));
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); resIdx = clamp(resIdx + (e.key === "ArrowDown" ? 1 : -1), 0, Math.min(resList.length, 80) - 1); paintResults(); }
  else if (e.key === "Enter" && resList.length){ e.preventDefault(); locate(resList[Math.max(resIdx, 0)]); q.blur(); }
  else if (e.key === "Escape"){ e.stopPropagation(); q.value = ""; runSearch(); q.blur(); }
});
function runSearch(){
  const term = q.value.trim();
  if (term.length < 2){ resList = []; results.classList.remove("show"); if (filter && filter.kind === "search") setFilter(null); return; }
  resList = searchAll(term); resIdx = -1;
  const set = new Set(resList.slice(0, 20000)), anc = new Set();
  for (const n of set) for (let k = n.p; k && !anc.has(k); k = k.p) anc.add(k);
  setFilter(resList.length ? {kind: "search", set, anc} : null);
  paintResults(); results.classList.add("show");
}
function paintResults(){
  results.innerHTML = "";
  const total = resList.reduce((a, n) => a + (isDir(n) ? 0 : n.s), 0);
  results.appendChild(el("div", "res-head", resList.length ? `${fmtInt(resList.length)} matches · ${human(total)} in matching files · ↑↓ Enter` : "No matches"));
  resList.slice(0, 80).forEach((n, i) => {
    const r = el("div", "res" + (i === resIdx ? " on" : ""));
    const col = isDir(n) ? "#4FB3D9" : CAT_INFO[catOf(n)].col;
    r.innerHTML = `<span class="sw" style="background:${col}"></span><div style="min-width:0"><div class="nm">${esc(n.n)}${isDir(n) ? "/" : ""}</div><div class="p">${esc(relOf(n.p || ROOT) || "/")}</div></div><span class="sz">${human(n.s)}</span>`;
    r.onmousedown = e => { e.preventDefault(); locate(n); q.blur(); };
    r.onmouseenter = () => { hoverLink = n; kick(); };
    r.onmouseleave = () => { hoverLink = null; kick(); };
    results.appendChild(r);
    if (i === resIdx) r.scrollIntoView({block: "nearest"});

}

/* ------------------------------------------------------------ tables */
function splitPath(rel){
  const i = Math.max(rel.lastIndexOf("/"), rel.lastIndexOf("\\"));
  return i < 0 ? `${esc(rel)}` : `<span class="dir">${esc(rel.slice(0, i + 1))}</span>${esc(rel.slice(i + 1))}`;
}
function fileTable(host, rows, showAge){
  if (!rows.length){ host.innerHTML = `<div class="empty">Nothing to show.</div>`; return; }
  const max = rows[0][0] || 1;
  const head = `<thead><tr><th>#</th><th style="text-align:right">Size</th><th></th><th>File</th><th>${showAge ? "Untouched for" : "Modified"}</th><th></th></tr></thead>`;
  const body = rows.map(([size, rel, day], i) => {
    const col = CAT_INFO[CAT_BY_EXT.get(extOf(rel)) || "other"].col, d = Math.min(i * 18, 700);
    return `<tr data-i="${i}" style="animation-delay:${d}ms"><td class="rank">${i + 1}</td><td class="num">${human(size)}</td>
      <td><span class="meter"><i style="width:${(size / max * 100).toFixed(1)}%;background:${col};animation-delay:${d + 100}ms"></i></span></td>
      <td class="path">${splitPath(rel)}</td><td class="dim">${showAge ? ago(day) : fmtDay(day)}</td><td class="go">locate →</td></tr>`;
  }).join("");
  host.innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
  host.querySelector("tbody").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) locate(resolve(rows[+tr.dataset.i][1])); });
  host.querySelector("tbody").addEventListener("mouseover", e => { const tr = e.target.closest("tr"); if (tr){ hoverLink = resolve(rows[+tr.dataset.i][1]); kick(); } });

}

  const max = rows[0][2] || 1;
  const body = rows.map(([ext, cnt, size], i) => {
    const cat = CAT_BY_EXT.get(ext.replace(/^\./, "")) || "other", col = CAT_INFO[cat].col, d = Math.min(i * 22, 700);
    const pct = ROOT.s ? size / ROOT.s * 100 : 0;
    return `<tr data-i="${i}" style="animation-delay:${d}ms"><td><span class="sw" style="background:${col};margin-right:8px;vertical-align:-1px"></span>${esc(ext)}</td>
      <td class="dim">${esc(CAT_INFO[cat].name)}</td><td class="num">${human(size)}</td><td class="dim" style="text-align:right">${fmtInt(cnt)}</td>
      <td><span class="meter"><i style="width:${(size / max * 100).toFixed(1)}%;background:${col};animation-delay:${d + 100}ms"></i></span><span class="dim">${pct.toFixed(1)}%</span></td>

  }).join("");

/* ------------------------------------------------------------ tree */
const treeHost = $("#tree");
function treeRow(n, parentSize){
  const wrap = el("div", "node"); wrap._n = n;
  const row = el("div", "row");
  const dir = isDir(n) && n.c && n.c.length;
  const pct = parentSize ? n.s / parentSize * 100 : 100;
  const col = isDir(n) ? "#4FB3D9" : isMore(n) ? "#3A5068" : CAT_INFO[catOf(n)].col;
  row.innerHTML = `<span class="caret">${dir ? "▸" : ""}</span>
    <span class="nm${isDir(n) ? " dirn" : ""}">${esc(label(n))}${isDir(n) ? "/" : ""}${isLink(n) ? '<span class="lnk">link</span>' : ""}${n.f & 8 ? `<span class="err">(${esc(n.x)})</span>` : ""}</span>
    <span class="sz">${human(n.s)}</span>
    <span class="bcell"><span class="meter" style="width:100px"><i style="width:${clamp(pct, 0, 100).toFixed(1)}%;background:${col}"></i></span></span>
    <span class="ct">${isDir(n) ? fmtInt(count(n)) + " items" : fmtDay(n.d)}</span>
    <span class="loc" title="Show in treemap">◎</span>`;
  wrap.appendChild(row);
  if (dir){
    const kw = el("div", "kidsw"), inner = el("div"); kw.appendChild(inner); wrap.appendChild(kw);
    row.addEventListener("click", e => { if (e.target.classList.contains("loc")) return; toggle(wrap); });
  }
  row.querySelector(".loc").addEventListener("click", e => { e.stopPropagation(); locate(n); });
  row.addEventListener("mouseenter", () => { hoverLink = n; kick(); });
  row.addEventListener("mouseleave", () => { hoverLink = null; kick(); });
  return wrap;
}
function fillKids(wrap){
  const inner = wrap.querySelector(":scope > .kidsw > div");
  if (inner.childElementCount) return;
  const n = wrap._n, frag = document.createDocumentFragment();
  for (const k of n.c) frag.appendChild(treeRow(k, n.s));
  inner.appendChild(frag);
}
function toggle(wrap, open){
  if (!wrap.querySelector(":scope > .kidsw")) return;
  const want = open == null ? !wrap.classList.contains("open") : open;
  if (want) fillKids(wrap);
  wrap.classList.toggle("open", want);
}
function renderTree(){
  treeHost.innerHTML = "";
  const top = treeRow(ROOT, 0); treeHost.appendChild(top);
  top.querySelector(".nm").textContent = DATA.root;
  if (ROOT.c && ROOT.c.length) toggle(top, true);
}
function nodeWrap(n){
  // Opens every folder on the way down so the row exists, then returns it.
  const chain = []; for (let k = n; k; k = k.p) chain.unshift(k);
  let wrap = treeHost.firstElementChild;
  for (let i = 1; i < chain.length; i++){
    toggle(wrap, true);
    const inner = wrap.querySelector(":scope > .kidsw > div");
    const next = [...inner.children].find(w => w._n === chain[i]);
    if (!next) break;
    wrap = next;
  }

}
function revealInTree(n){

  setTimeout(() => { const r = w.querySelector(".row"); r.scrollIntoView({behavior: "smooth", block: "center"}); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash"); }, 380);
}
$("#tr-collapse").onclick = () => { treeHost.querySelectorAll(".node.open").forEach(w => w.classList.remove("open")); toggle(treeHost.firstElementChild, true); };
$("#tr-heavy").onclick = () => {
  // Open the biggest child at each level, one beat at a time.
  let n = ROOT, steps = [];
  while (n.c && n.c.length){ const k = n.c.filter(x => isDir(x) && x.c && x.c.length).sort((a, b) => b.s - a.s)[0]; if (!k) break; steps.push(k); n = k; if (steps.length > 14) break; }
  steps.forEach((k, i) => setTimeout(() => {
    const w = nodeWrap(k); toggle(w, true);
    const r = w.querySelector(".row"); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
    if (i === steps.length - 1) r.scrollIntoView({behavior: "smooth", block: "center"});
  }, REDUCED ? 0 : i * 260));
};

/* ------------------------------------------------------------ tabs */
function selectTab(id){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.pane === id));
  document.querySelectorAll(".pane").forEach(p => {
    const on = p.id === id;
    if (on && !p.classList.contains("on")){ p.classList.add("on"); p.querySelectorAll("tbody tr,.meter i").forEach(x => { x.style.animation = "none"; void x.offsetWidth; x.style.animation = ""; }); }
    else if (!on) p.classList.remove("on");
  });
  placeTabline();
}
function placeTabline(){ const t = $(".tab.on"), line = $("#tabline"); line.style.left = t.offsetLeft + "px"; line.style.width = t.offsetWidth + "px"; }
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => selectTab(t.dataset.pane)));

/* ------------------------------------------------------------ boot */
$("#rootpath").textContent = DATA.root + " · scanned " + META.generated;
tween($("#st-size"), 0, ROOT.s, human, 1300);
tween($("#st-files"), 0, META.files, fmtInt, 1300);
tween($("#st-dirs"), 0, META.dirs, fmtInt, 1300);
tween($("#st-time"), 0, META.elapsed, v => v.toFixed(1) + "s", 1300);
document.querySelector('.tab[data-pane="p-largest"]').innerHTML += `<small>${DATA.largest.length}</small>`;
document.querySelector('.tab[data-pane="p-types"]').innerHTML += `<small>${DATA.ext.length}</small>`;
document.querySelector('.tab[data-pane="p-old"]').innerHTML += `<small>${DATA.old.length}</small>`;
$("#old-note").textContent = `Biggest files not modified in over ${META.minAgeDays} days.`;
fileTable($("#t-largest"), DATA.largest, false);
typeTable($("#t-types"));
fileTable($("#t-old"), DATA.old, true);
renderTree();
const notes = [];
if (META.maxTreeDepth != null) notes.push(`Tree capped at depth ${META.maxTreeDepth}.`);
notes.push(`Folders list at most ${fmtInt(META.maxChildren)} children; the rest are grouped.`);
if (META.errors) notes.push(`${fmtInt(META.errors)} unreadable entries.`);
if (META.links) notes.push(`${fmtInt(META.links)} symlinks/junctions listed at 0 B and not followed.`);
$("#foot").innerHTML = `Generated locally by diskmap.py. Nothing left this machine.<br>${notes.join(" ")}`;
resize();
renderCrumbs(); renderInspector(ROOT); renderLegend(); placeTabline();
setTimeout(() => { $("#hint").style.opacity = .0; }, 9000);
if (!ROOT.s) $("#hint").textContent = "This folder is empty.";
})();
</script>
</body></html>
